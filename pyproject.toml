[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "godata"
version = "0.2.0"
description = "Proxy HTTP para SQL Server usando autenticação integrada do Windows"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "GoData contributors"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.116,<1",
    "python-dotenv>=1.1,<2",
    "pyodbc>=5.2,<6",
    "sqlglot>=28.10.1",
    "uvicorn[standard]>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/wanbnn/godata"
Source = "https://github.com/wanbnn/godata"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/godata"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.prpm.scripts]
dev = ["uvicorn", "godata.main:app", "--app-dir", "src", "--host", "127.0.0.1", "--port", "4400", "--reload"]
start = ["uvicorn", "godata.main:app", "--app-dir", "src", "--host", "127.0.0.1", "--port", "4400"]
tunnel = ["cloudflared", "tunnel", "--url", "http://127.0.0.1:4400"]
tunnel-prod = ["cloudflared", "tunnel", "--config", "cloudflared/config.yml", "run"]
test = ["python", "-m", "pytest"]
